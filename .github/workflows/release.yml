name: release

# Release-only publish for FS.GG.Audio. Tag-triggered; NEVER a required check and NEVER on push/PR
# (mirrors the sibling FS-GG repos' release cadence). Publishes the coherent set
# FS.GG.Audio.Core + .Host + .Elmish + .Engine + .WebBrowser to the org GitHub Packages feed
# (nuget.pkg.github.com/FS-GG), then dual-publishes the BYTE-IDENTICAL set to public nuget.org via
# Trusted Publishing / OIDC (ADR-0012/0013 — no stored key). It ALSO attaches the "schema/apps"
# artifacts to the GitHub Release: the committed .fsi API surface, the SDD lifecycle artifacts, and
# the built sample app. Everything is gated on a green headless build+test first (publish-before-flip).
#
# All five packages share ONE version — <FsGgAudioVersion> in Directory.Packages.props (the
# version-of-truth) — and move as a coherent set. Engine/Elmish/Host/WebBrowser ProjectReferences to Core are
# emitted as package dependencies at the same version.
#
# NOTE (manual, one-time): the nuget.org push needs an org Trusted Publishing policy registered for
# this repo (Repository FS.GG.Audio, Workflow release.yml) plus a NUGET_USER secret; until then that
# step 401s and fails the release loud. The org-feed push works with the built-in GITHUB_TOKEN.

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (e.g. 0.1.0-preview.1). Required to publish or recover; omit for a pack-only dry run."
        type: string
        required: false
      source_run_id:
        description: "Failed tag release run whose retained package artifact must be resumed."
        type: string
        required: false
      skills_version:
        description: "Recover this skills version from the org feed and publish the same archive publicly."
        type: string
        required: false
      skills_source_run_id:
        description: "Failed release-skills run that originally published the archive to the org feed."
        type: string
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover-skills:
    name: Recover FS.GG.Audio.Skills from the org feed
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.Audio' && github.event_name == 'workflow_dispatch' && inputs.skills_version != ''
    permissions:
      actions: read
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Authenticate failed skills release
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.skills_source_run_id }}
          VERSION: ${{ inputs.skills_version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::skills_version must be a stable three-part version"
            exit 1
          }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::skills_source_run_id must be numeric"
            exit 1
          }
          git fetch --force origin "refs/tags/skills/v$VERSION:refs/tags/skills/v$VERSION"
          source_head="$(git rev-parse "refs/tags/skills/v$VERSION^{commit}")"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg head "$source_head" --arg branch "skills/v$VERSION" \
            '.event == "push" and .head_branch == $branch and .head_sha == $head and .status == "completed" and .conclusion == "failure" and .path == ".github/workflows/release-skills.yml"' \
            <<<"$run_json" >/dev/null || {
              echo "::error::run $SOURCE_RUN_ID is not the failed skills release for immutable tag skills/v$VERSION at $source_head"
              exit 1
            }
          echo "source-head=$source_head" >> "$GITHUB_OUTPUT"
      - name: Recover and verify the exact org-feed archive
        id: archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.skills_version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/audio-skills-recovery"
          packages="$work/packages"
          mkdir -p "$work" "$packages"
          dotnet nuget add source https://nuget.pkg.github.com/FS-GG/index.json \
            --name org --username FS-GG --password "$GH_TOKEN" --store-password-in-clear-text \
            --configfile "$work/NuGet.Config"
          cat > "$work/recovery.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup><PackageReference Include="FS.GG.Audio.Skills" Version="[$VERSION]" /></ItemGroup>
          </Project>
          EOF
          dotnet restore "$work/recovery.csproj" --packages "$packages" \
            --configfile "$work/NuGet.Config" --no-http-cache
          archive="$packages/fs.gg.audio.skills/$VERSION/fs.gg.audio.skills.$VERSION.nupkg"
          recorded_sha512="$packages/fs.gg.audio.skills/$VERSION/fs.gg.audio.skills.$VERSION.nupkg.sha512"
          test -s "$archive"
          test -s "$recorded_sha512"
          actual_sha512="$(openssl dgst -sha512 -binary "$archive" | base64 -w0)"
          expected_sha512="$(tr -d '\r\n' < "$recorded_sha512")"
          [[ "$actual_sha512" == "$expected_sha512" ]] || {
            echo "::error::recovered archive does not match the org feed's recorded package hash"
            exit 1
          }
          python3 - "$archive" <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as package:
              manifest = json.loads(package.read("audio-skills/skill-manifest.json"))
              assert manifest["schemaVersion"] == 2
              assert [skill["id"] for skill in manifest["skills"]] == ["fs-gg-browser-audio"]
          PY
          sha256sum "$archive" | tee "$work/ORIGINAL_SHA256"
          cp "$recorded_sha512" "$work/ORIGINAL_SHA512"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          echo "work=$work" >> "$GITHUB_OUTPUT"
      - name: Retain recovered original before public publication
        id: custody
        uses: actions/upload-artifact@v7
        with:
          name: audio-skills-release-custody-${{ steps.source.outputs.source-head }}-${{ inputs.skills_version }}
          path: |
            ${{ steps.archive.outputs.path }}
            ${{ steps.archive.outputs.work }}/ORIGINAL_SHA256
            ${{ steps.archive.outputs.work }}/ORIGINAL_SHA512
          if-no-files-found: error
          retention-days: 90
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || 'Paradigma11' }}
      - name: Push recovered original to nuget.org
        run: dotnet nuget push "${{ steps.archive.outputs.path }}" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
      - name: Verify public payload against the recovered original
        shell: bash
        env:
          ORIGINAL: ${{ steps.archive.outputs.path }}
          VERSION: ${{ inputs.skills_version }}
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/fs.gg.audio.skills.$VERSION.public.nupkg"
          for i in $(seq 1 24); do
            curl -fsSL -o "$public" "https://api.nuget.org/v3-flatcontainer/fs.gg.audio.skills/$VERSION/fs.gg.audio.skills.$VERSION.nupkg" && break
            sleep 5
          done
          test -s "$public"
          python3 - "$ORIGINAL" "$public" <<'PY'
          import hashlib, json, sys, zipfile

          def payload(path):
              with zipfile.ZipFile(path) as package:
                  entries = []
                  for name in sorted(package.namelist()):
                      lowered = name.lower()
                      if name.endswith("/") or name.endswith(".signature.p7s") or "/package/services/metadata/core-properties/" in lowered:
                          continue
                      entries.append(name.encode() + b"\0" + hashlib.sha256(package.read(name)).digest())
                  return hashlib.sha256(b"".join(entries)).hexdigest()

          original, public = map(payload, sys.argv[1:])
          assert original == public, (original, public)
          print(f"original-payload-sha256={original}")
          print(f"public-payload-sha256={public}")
          PY
          sha256sum "$public"
          echo "custody-artifact-id=${{ steps.custody.outputs.artifact-id }}"
          echo "custody-artifact-digest=${{ steps.custody.outputs.artifact-digest }}"

  verify:
    name: Verify (locked restore + headless build + test)
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.Audio' && (github.event_name != 'workflow_dispatch' || inputs.skills_version == '')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && format('refs/tags/v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore (locked)
        run: |
          set -euo pipefail
          if ! dotnet restore FS.GG.Audio.slnx --locked-mode; then
            echo "::error::locked restore failed — resolved graph != committed packages.lock.json. If intentional: dotnet restore FS.GG.Audio.slnx --force-evaluate  and commit the lockfiles."
            exit 1
          fi
      - name: Build (Debug, --no-restore)
        run: dotnet build FS.GG.Audio.slnx -c Debug --no-restore
      # THE SAME device lane the PR gate runs, and for a better reason. This job ran a bare
      # `dotnet test`: no driver selection, no skip assertion — so the device tests could quietly skip
      # at the one moment that ships bytes to nuget.org, which is the vacuous lane gate.yml exists to
      # prevent, reappearing in the workflow that publishes (review §3.12).
      - uses: ./.github/actions/headless-test

  publish:
    name: Publish packages (org feed + nuget.org) + schema/apps assets
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.Audio' && (github.event_name != 'workflow_dispatch' || inputs.skills_version == '')
    needs: [verify]
    permissions:
      actions: read      # authenticate and download a failed run's retained release bytes
      contents: write     # create/upload GitHub Release assets
      packages: write      # push to the org GitHub Packages feed
      id-token: write      # ADR-0013: mint the GitHub OIDC token for nuget.org Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && format('refs/tags/v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from the release tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            release)           raw="${{ github.event.release.tag_name }}" ;;
            push)              raw="${GITHUB_REF_NAME}" ;;
            workflow_dispatch)
              requested="${{ inputs.version }}"
              raw="${requested:+v${requested#v}}"
              ;;
            *)                 raw="" ;;
          esac
          ver="${raw#v}"   # v0.1.0-preview.1 -> 0.1.0-preview.1
          if [[ -z "$ver" ]]; then
            echo "::notice::No version (manual run without input) — pack-only dry run, no push."
            echo "push=false" >> "$GITHUB_OUTPUT"
            ver="0.0.0-dryrun.${GITHUB_RUN_ID}"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=${raw}" >> "$GITHUB_OUTPUT"
          echo "Release version: $ver"

      # The tag is the trigger; <FsGgAudioVersion> in Directory.Packages.props is the version the
      # packages actually carry. They MUST agree, else the tag advertises bytes it doesn't match.
      - name: Guard — tag version == repo version-of-truth
        if: steps.ver.outputs.push == 'true'
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          truth="$(grep -oP '(?<=<FsGgAudioVersion>)[^<]+' Directory.Packages.props)"
          [[ -n "$truth" ]] || { echo "::error::<FsGgAudioVersion> not found in Directory.Packages.props"; exit 1; }
          if [[ "$truth" != "$VER" ]]; then
            echo "::error::tag version ($VER) != Directory.Packages.props <FsGgAudioVersion> ($truth). Bump the version-of-truth to match the tag in the release PR."
            exit 1
          fi
          echo "Version-of-truth matches the tag: $VER"

      - name: Pack the coherent set (@ $VER)
        if: inputs.source_run_id == ''
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # --locked-mode, as `verify` uses. This is a DIFFERENT JOB on a DIFFERENT RUNNER, so its
          # restore is its own: without the flag, the graph that gets packed and pushed to nuget.org
          # is not the graph `verify` validated, and the lockfiles guarantee nothing about what
          # actually ships (review §3.12).
          if ! dotnet restore FS.GG.Audio.slnx --locked-mode; then
            echo "::error::locked restore failed in the PUBLISH job — the graph about to be packed does not match the committed packages.lock.json. Refusing to publish a set nobody verified."
            exit 1
          fi
          dotnet pack FS.GG.Audio.slnx -c Release -p:Version="$VER" -o artifacts/packages
          (cd artifacts/packages && sha256sum -- *.nupkg | sort -k2 > SHA256SUMS)
          echo "Packed:"; ls -1 artifacts/packages/*.nupkg

      - name: Authenticate failed release custody
        if: inputs.source_run_id != ''
        id: recovery
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::source_run_id must be numeric"; exit 1; }
          source_head="$(git rev-parse HEAD)"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg head "$source_head" --arg branch "v$VER" \
            '.event == "push" and .head_branch == $branch and .head_sha == $head and .status == "completed" and .conclusion == "failure" and .path == ".github/workflows/release.yml"' \
            <<<"$run_json" >/dev/null || {
              echo "::error::run $SOURCE_RUN_ID is not the failed release for immutable tag v$VER at $source_head"
              exit 1
            }
          artifact="audio-release-custody-$source_head-$VER"
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          jq -e --arg name "$artifact" \
            '[.artifacts[] | select(.name == $name and .expired == false and ((.digest // "") | test("^sha256:[0-9a-f]{64}$")))] | length == 1' \
            <<<"$artifacts_json" >/dev/null || {
              echo "::error::run $SOURCE_RUN_ID has no unique retained artifact $artifact"
              exit 1
            }
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Download retained release bytes
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.recovery.outputs.artifact }}
          path: artifacts/packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify coherent release custody
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/packages
          sha256sum --check SHA256SUMS
          primary="$(find . -maxdepth 1 -type f -name '*.nupkg' ! -name '*.snupkg' -printf '%f\n' | sort)"
          [[ "$(printf '%s\n' "$primary" | sed '/^$/d' | wc -l)" == 5 ]] || {
            echo "::error::release custody must contain exactly five primary packages; found: $primary"
            exit 1
          }

      - name: Restore asset build inputs during recovery
        if: inputs.source_run_id != ''
        run: dotnet restore FS.GG.Audio.slnx --locked-mode

      - name: Retain original coherent package bytes before publication
        if: inputs.source_run_id == ''
        uses: actions/upload-artifact@v7
        with:
          name: audio-release-custody-${{ github.sha }}-${{ steps.ver.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Push coherent set to nuget.pkg.github.com/FS-GG
        if: steps.ver.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://nuget.pkg.github.com/FS-GG/index.json \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --no-symbols \
            --skip-duplicate
          echo "Published FS.GG.Audio.* ${{ steps.ver.outputs.version }} to the org feed."

      # Dual-publish to nuget.org via Trusted Publishing / OIDC (ADR-0012/0013 — no stored key). The
      # org Trusted Publishing policy `fs-gg-audio-publishing` (Paradigma11 / FS-GG/FS.GG.Audio /
      # release.yml) matches this exchange; `user` is the public nuget.org owner (not a secret),
      # secret-overridable like the sibling repos. Fails loud if the policy is ever removed.
      - name: NuGet login (OIDC → short-lived nuget.org key)
        if: steps.ver.outputs.push == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || 'Paradigma11' }}
      - name: Push coherent set to nuget.org (public)
        if: steps.ver.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --no-symbols \
            --skip-duplicate
          echo "Published FS.GG.Audio.* ${{ steps.ver.outputs.version }} to nuget.org."

      - name: Read back and compare both feed payloads
        if: steps.ver.outputs.push == 'true'
        shell: bash
        env:
          FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/readback/github artifacts/readback/nuget
          for package in artifacts/packages/*.nupkg; do
            file="$(basename "$package")"
            id="${file%.$VER.nupkg}"
            lower="${id,,}"
            github_url="https://nuget.pkg.github.com/FS-GG/download/$lower/$VER/$lower.$VER.nupkg"
            nuget_url="https://api.nuget.org/v3-flatcontainer/$lower/$VER/$lower.$VER.nupkg"
            for feed in github nuget; do
              url="$github_url"; auth=(--user "fs-gg:$FEED_TOKEN")
              if [ "$feed" = nuget ]; then url="$nuget_url"; auth=(); fi
              for attempt in {1..60}; do
                if curl --fail --location --silent --show-error "${auth[@]}" "$url" \
                  --output "artifacts/readback/$feed/$file"; then break; fi
                [ "$attempt" != 60 ] || exit 4
                echo "Waiting for $feed readback of $id $VER ($attempt/60)"
                sleep 10
              done
            done
          done
          python3 - artifacts/packages artifacts/readback artifacts/readback.json <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          originals, readbacks, report = map(Path, sys.argv[1:])
          def payload(path):
              with ZipFile(path) as archive:
                  return {name: sha256(archive.read(name)).hexdigest()
                          for name in archive.namelist() if name != '.signature.p7s'}
          rows = []
          for original in sorted(originals.glob('*.nupkg')):
              expected = payload(original)
              row = {'file': original.name, 'originalSha256': sha256(original.read_bytes()).hexdigest(), 'feeds': {}}
              for feed in ('github', 'nuget'):
                  remote = readbacks / feed / original.name
                  observed = payload(remote)
                  if observed != expected:
                      raise SystemExit(f'{feed} payload differs for {original.name}')
                  row['feeds'][feed] = {'archiveSha256': sha256(remote.read_bytes()).hexdigest(),
                                        'payloadMembers': len(observed), 'payloadMatch': True}
              rows.append(row)
          if len(rows) != 5:
              raise SystemExit(f'expected five primary package readbacks, got {len(rows)}')
          report.write_text(json.dumps({'schema': 'fsgg.audio.release-readback/v1', 'packages': rows}, indent=2) + '\n')
          PY

      - name: Retain dual-feed readback evidence
        if: steps.ver.outputs.push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: audio-release-readback-${{ steps.ver.outputs.version }}-${{ github.run_id }}
          path: artifacts/readback.json
          if-no-files-found: error
          retention-days: 90

      # ── schema / apps release assets ────────────────────────────────────────────────────────
      - name: Bundle schema (.fsi API surface) + SDD artifacts + sample app
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/assets
          # schema: the committed public .fsi surface for every package.
          ( cd docs/api-surface && zip -qr - . ) > "artifacts/assets/fs-gg-audio-api-surface-$VER.zip"
          # SDD schema/apps artifacts: the authored lifecycle artifacts (charter..evidence, contracts).
          zip -qr "artifacts/assets/fs-gg-audio-sdd-artifacts-$VER.zip" work -x '*/obj/*' '*/bin/*'
          # sample app: a framework-dependent build of the headless demo.
          dotnet publish samples/FS.GG.Audio.Sample/FS.GG.Audio.Sample.fsproj -c Release -o artifacts/sample --no-restore
          ( cd artifacts/sample && zip -qr - . ) > "artifacts/assets/fs-gg-audio-sample-$VER.zip"
          echo "Assets:"; ls -1 artifacts/assets

      - name: Attach packages + schema/apps assets to the GitHub Release
        if: steps.ver.outputs.push == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "FS.GG.Audio $TAG — packages on the org feed + nuget.org; schema (.fsi), SDD artifacts, and the sample app attached below."
          gh release upload "$TAG" artifacts/assets/*.zip artifacts/packages/*.nupkg --clobber
          echo "Attached schema/apps assets and packages to release $TAG."
